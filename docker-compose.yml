
services:
  tailscale:
    image: tailscale/tailscale:latest
    # hostname: tailscale
    container_name: tailscale
    env_file: .env
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
      - TS_STATE_DIR=/var/lib/tailscale
      # - TS_EXTRA_ARGS=--advertise-tags=tag:container
    networks:
      - localbridge
    volumes:
      - tailscale_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    # hostname: ollama
    container_name: ollama
    healthcheck:
      test: "bash -c 'cat < /dev/null > /dev/tcp/localhost/11434'"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    tty: true
    restart: unless-stopped
    volumes:
      - ./ollama/ollama_data:/root/.ollama
    network_mode: "service:tailscale"
    env_file: .env
    environment:
      - OLLAMA_HOST=127.0.0.1
    # ports:
    #   - "${OLLAMA_PORT}"
    
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  setup:
    image: alpine:latest
    # hostname: setup
    container_name: setup
    network_mode: "service:tailscale"
    # extra_hosts:
    #   - host.docker.internal:host-gateway
    depends_on:
      ollama:
        condition: service_healthy
    tty: true
    command:
      - sh
      - -c
      - |
        apk add --no-cache docker
        docker -H unix:///var/run/docker.sock exec -it ollama sh -c 'ollama pull ${STARTING_MODEL}'
        tail -F /dev/null
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock


  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    # hostname: open-webui
    container_name: open-webui
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./open-webui/data:/app/backend/data
    network_mode: "service:tailscale"
    # ports:
    #   - "${WEBUI_PORT}:${WEBUI_PORT}"
    env_file: .env
    # extra_hosts:
    #   - host.docker.internal:host-gateway
    restart: unless-stopped
  


  # stable-diffusion:
  #   image: universonic/stable-diffusion-webui:latest
  #   container_name: sd-webui
  #   ports:
  #     - "7860:7860"
  #   volumes:
  #     - ./stable-diffusion/models:/data/models
  #     - ./stable-diffusion/outputs:/data/outputs
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   restart: unless-stopped

volumes:
  tailscale_data:
  openwebui_data: {}
  # stable_diffusion_models: {}
  # stable_diffusion_outputs: {}

networks:
  localbridge:
    driver: bridge
