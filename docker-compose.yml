
services:

  ollama:
    # Points to the directory where your Dockerfile is located ('.' assumes the same folder)
    build:
      context: ./ollama
    hostname: ollama
    container_name: ollama
    # Note: The healthcheck block can safely be removed here since it is now baked into the Dockerfile,
    # but keeping it here would let you override the Dockerfile defaults if ever needed.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://ollama:11434"]
      interval: 15s
      timeout: 30s
      retries: 5
      # Highlight-start
      start_period: 45s
    restart: unless-stopped
    volumes:
      - ./ollama/ollama_data:/root/.ollama
    networks:
      - ai-network
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file: .env
    ports:
      - "${OLLAMA_PORT}:${OLLAMA_PORT}"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]


  setup:
    image: alpine:latest
    hostname: setup
    container_name: setup
    networks:
      - ai-network
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      ollama:
        condition: service_healthy
    tty: true
    command:
      - sh
      - -c
      - |
        apk add --no-cache docker
        docker -H unix:///var/run/docker.sock exec -it ollama sh -c 'ollama pull ${STARTING_MODEL}'
        tail -F /dev/null
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock


  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    hostname: open-webui
    container_name: open-webui
    depends_on:
      ollama:
        condition: service_started
    volumes:
      - ./open-webui/data:/app/backend/data
    networks:
      - ai-network
    ports:
      - "${WEBUI_PORT}:${WEBUI_PORT}"
    env_file: .env
    extra_hosts:
      - host.docker.internal:host-gateway
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped



# volumes:
  # stable_diffusion_models: {}
  # stable_diffusion_outputs: {}

networks:
  ai-network:
    driver: bridge